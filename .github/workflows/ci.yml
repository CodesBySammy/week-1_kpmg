name: CI/CD Pipeline - Controlled AI Workflow

on:
  push:
    branches: [ main, master, "week*" ]
  pull_request:
    branches: [ main, master ]

jobs:
  quality-and-tests:
    name: Lint, Test & Coverage Gate
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System & Build Dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel

      - name: Install Project and Test Dependencies
        run: |
          pip install -e ".[dev]"

      - name: Verify Environment & Core Imports
        run: |
          python -c "import app, pipeline, rag, security, tools, workflow, observability; print('All core modules imported successfully')"

      - name: Run Test Suite with Coverage
        run: |
          pytest --cov=app --cov=pipeline --cov=rag --cov=security --cov=tools --cov=workflow --cov=observability \
                 --cov-report=term-missing \
                 --cov-report=xml \
                 --cov-fail-under=70

      - name: Verify Readiness & Healthcheck Contract
        run: |
          python -c "from app.main import app; from fastapi.testclient import TestClient; client = TestClient(app); assert client.get('/health').status_code == 200; assert client.get('/ready').status_code == 200; print('Health & Readiness probes verified!')"
